# Render Blueprint — provisions API + worker + beat + Redis in one shot.
# Database lives in Supabase (already migrated); this file only spins up
# compute + a managed Redis instance for Celery's broker / cache.
#
# How to use:
#   1. Push this repo to GitHub (one-time)
#   2. Render dashboard → New + → Blueprint → pick the repo → Apply
#   3. Render reads this file, prompts you to fill the `sync: false`
#      env vars (Supabase URL/keys + LLM key), creates everything.
#
# fromService vs sync:false — read this before editing.
#
#   * Use ``fromService`` ONLY for vars that are REQUIRED on the parent
#     and that you want one-source-of-truth for. Supabase URL / keys
#     / JWT secret / Redis URL all qualify — every service needs the
#     same value, the parent's copy is mandatory, so `fromService`
#     keeps them in sync.
#
#   * Use per-service ``sync: false`` for OPTIONAL vars whose absence
#     is benign (Sentry, YouTube cookies, LLM provider keys you may
#     not use). Render REFUSES Blueprint sync when a `fromService`
#     reference points at a var that doesn't exist on the parent,
#     and `sync: false` means "user-supplied — may be empty". A
#     `fromService` to a sync:false-empty var blocks the whole sync
#     even though the workers don't actually need it.
#
#   See docs/SYSTEM_INVARIANTS.md → "Celery / Worker topology" for
#   the rationale. (Incident: May 12 2026.)

services:
  # ── Managed Redis (Celery broker + result backend + rate-limit + state cache)
  - type: redis
    name: smms-redis
    plan: starter
    ipAllowList: []                   # private to Render services
    maxmemoryPolicy: allkeys-lru

  # ── FastAPI web service
  - type: web
    name: smms-api
    runtime: docker
    rootDir: backend
    plan: starter
    # Readiness probe — pings Postgres + Redis before reporting healthy.
    # Render takes the instance out of rotation on 503 without killing it.
    healthCheckPath: /api/v1/ready
    envVars:
      - key: ENV
        value: prod
      - key: PERSISTENCE_BACKEND
        value: supabase
      - key: AUTH_BACKEND
        value: supabase
      - key: OBS_LOG_JSON
        value: "true"
      - key: LLM_DEFAULT_PROVIDER
        value: anthropic
      - key: SEC_TOKEN_VAULT_MASTER_KEY
        generateValue: true             # Render auto-generates a 32-byte secret

      # ── Supabase — paste these in the Blueprint setup form
      - key: SUPABASE_URL
        sync: false                     # https://ukaulrxhegrqyfrirnkb.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                     # Settings → API → service_role
      - key: SUPABASE_JWT_SECRET
        sync: false                     # Settings → API → JWT Settings
      - key: SUPABASE_POSTGRES_CONNECTION_STRING
        sync: false                     # postgresql+asyncpg://postgres.<ref>:<pwd>@...

      # ── LLM key
      - key: LLM_ANTHROPIC_API_KEY
        sync: false

      # ── YouTube cookies (base64 of Netscape-format cookies.txt
      # exported from a logged-in browser). Optional — when missing,
      # yt-dlp tries iOS / Android player clients before giving up.
      # See docs/RUNBOOK.md → 'YouTube cookies' for the export steps.
      - key: YTDLP_COOKIES_B64
        sync: false

      # ── Sentry — leave blank to disable; SDK becomes a no-op
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

      # ── Wired automatically from the Redis service
      - key: REDIS_URL
        fromService: { type: redis, name: smms-redis, property: connectionString }
      - key: QUEUE_BROKER_URL
        fromService: { type: redis, name: smms-redis, property: connectionString }
      - key: QUEUE_RESULT_BACKEND
        fromService: { type: redis, name: smms-redis, property: connectionString }

  # ── Celery worker (drains workflows, publish, publish_dlq queues)
  - type: worker
    name: smms-worker
    runtime: docker
    rootDir: backend
    plan: starter
    # ``default`` is required so the worker drains:
    #   * app.workers.scheduler.tick_scheduler  (Beat hits every minute —
    #     this is what fires scheduled workflows)
    #   * app.workers.metrics_collector.collect_all_metrics  (Beat hits
    #     every 3 hours)
    # Both tasks are routed to the ``default`` queue in celery_app.py.
    # Forgetting ``default`` here is a silent failure mode: Beat enqueues
    # the tasks every minute, no worker consumes them, and scheduled
    # runs never fire (incident May 12 2026).
    dockerCommand: celery -A app.infrastructure.queue.celery_app.celery_app worker -Q default,workflows,publish,publish_dlq -l info
    envVars:
      - key: ENV
        value: prod
      - key: PERSISTENCE_BACKEND
        value: supabase
      - key: OBS_LOG_JSON
        value: "true"
      # Secrets inherited from smms-api (single source of truth — see
      # the durable-jobs-worker block below for the rationale).
      - key: SEC_TOKEN_VAULT_MASTER_KEY
        fromService: { type: web, name: smms-api, envVarKey: SEC_TOKEN_VAULT_MASTER_KEY }
      - key: SUPABASE_URL
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_URL }
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_SERVICE_ROLE_KEY }
      - key: SUPABASE_JWT_SECRET
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_JWT_SECRET }
      - key: SUPABASE_POSTGRES_CONNECTION_STRING
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_POSTGRES_CONNECTION_STRING }
      # Optional secrets — per-service sync:false rather than
      # fromService (see header comment for why). Paste the same value
      # here as on smms-api if you want them; leave empty otherwise.
      - key: LLM_ANTHROPIC_API_KEY
        sync: false
      - key: LLM_DEFAULT_PROVIDER
        value: anthropic
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: YTDLP_COOKIES_B64
        sync: false
      - key: REDIS_URL
        fromService: { type: redis, name: smms-redis, property: connectionString }
      - key: QUEUE_BROKER_URL
        fromService: { type: redis, name: smms-redis, property: connectionString }
      - key: QUEUE_RESULT_BACKEND
        fromService: { type: redis, name: smms-redis, property: connectionString }

  # ── Durable jobs worker (Pillar 1)
  # Drains smms.jobs (run.start → run.publish, engagement.fetch, system jobs).
  # Independent from the Celery worker above — Celery handles legacy publish
  # DLQ; this one runs the Postgres-backed durable engine.
  - type: worker
    name: smms-jobs-worker
    runtime: docker
    rootDir: backend
    plan: starter
    dockerCommand: python -m app.services.jobs.worker
    envVars:
      - key: ENV
        value: prod
      - key: PERSISTENCE_BACKEND
        value: supabase
      - key: OBS_LOG_JSON
        value: "true"
      - key: SMMS_WORKERS_CONCURRENCY
        value: "4"
      - key: SMMS_WORKERS_HTTP_PORT
        value: "8080"
      - key: OTEL_SERVICE_NAME
        value: smms-jobs-worker
      # ─── Secrets inherited from smms-api ──────────────────────────
      # Single source of truth: the API service is where you paste these
      # values when applying the Blueprint. Every other compute pulls
      # them via ``fromService`` so a new worker (or a re-sync of an
      # existing one) NEVER boots with empty secrets — which was the
      # exact failure mode that produced the May 2026 DNS lookup
      # warnings ([Errno -2] Name or service not known on every claim).
      - key: SEC_TOKEN_VAULT_MASTER_KEY
        fromService: { type: web, name: smms-api, envVarKey: SEC_TOKEN_VAULT_MASTER_KEY }
      - key: SUPABASE_URL
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_URL }
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_SERVICE_ROLE_KEY }
      - key: SUPABASE_JWT_SECRET
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_JWT_SECRET }
      - key: SUPABASE_POSTGRES_CONNECTION_STRING
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_POSTGRES_CONNECTION_STRING }
      # Optional secrets — per-service sync:false (see header for why
      # fromService doesn't work for vars that may be empty on the parent).
      - key: LLM_ANTHROPIC_API_KEY
        sync: false
      - key: LLM_DEFAULT_PROVIDER
        value: anthropic
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # Slack alerts — independent of the API since you may want
      # different paging routes for worker-only conditions (DLQ flood,
      # orphan sweeps). Keep as sync:false so a missing value just
      # silences alerts rather than breaking the worker.
      - key: SMMS_ALERTS_SLACK_URL
        sync: false
      # Used by MediaImportService when yt-dlp hits YouTube's bot gate.
      # Per-service sync:false rather than fromService because cookies
      # are optional — workers fall back to iOS/Android player clients
      # when no cookies are set.
      - key: YTDLP_COOKIES_B64
        sync: false
      # Same Redis the API uses — keeps cache + per-org rate-limit state
      # consistent across processes.
      - key: REDIS_URL
        fromService: { type: redis, name: smms-redis, property: connectionString }

  # ── Celery Beat (drives scheduled workflows + nightly metrics + engagement poll)
  - type: worker
    name: smms-beat
    runtime: docker
    rootDir: backend
    plan: starter
    dockerCommand: celery -A app.infrastructure.queue.celery_app.celery_app beat -l info
    envVars:
      - key: ENV
        value: prod
      - key: PERSISTENCE_BACKEND
        value: supabase
      - key: OBS_LOG_JSON
        value: "true"
      # Secrets inherited from smms-api (single source of truth).
      - key: SEC_TOKEN_VAULT_MASTER_KEY
        fromService: { type: web, name: smms-api, envVarKey: SEC_TOKEN_VAULT_MASTER_KEY }
      - key: SUPABASE_URL
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_URL }
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_SERVICE_ROLE_KEY }
      - key: SUPABASE_JWT_SECRET
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_JWT_SECRET }
      - key: SUPABASE_POSTGRES_CONNECTION_STRING
        fromService: { type: web, name: smms-api, envVarKey: SUPABASE_POSTGRES_CONNECTION_STRING }
      # Optional — per-service sync:false (see header for the why).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: REDIS_URL
        fromService: { type: redis, name: smms-redis, property: connectionString }
      - key: QUEUE_BROKER_URL
        fromService: { type: redis, name: smms-redis, property: connectionString }
      - key: QUEUE_RESULT_BACKEND
        fromService: { type: redis, name: smms-redis, property: connectionString }
