# Fly.io — `fly launch` then `fly deploy` from /backend.
# This config deploys the FastAPI service. Worker + beat are separate apps.

app = "smms-api"
primary_region = "iad"

[build]
  dockerfile = "../backend/Dockerfile"

[env]
  ENV = "prod"
  PERSISTENCE_BACKEND = "supabase"
  AUTH_BACKEND = "supabase"
  OBS_LOG_JSON = "true"
  PYTHONUNBUFFERED = "1"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [http_service.checks]
    [[http_service.checks.http]]
      interval = "10s"
      timeout = "2s"
      method = "GET"
      path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
