name: E2E

# End-to-end tests with Playwright. Boots both the backend (memory mode,
# no Postgres) and the frontend dev server, then runs the suite against
# them. The memory backend means the audit/llm_usage specs cleanly skip
# (they assert 503 → skip), which is fine — those paths are exercised
# manually against a real Supabase project before each release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Force the dev-mode auth shortcut on (see app/core/security.py).
      ENV: dev
      # Tell the proxy where the backend is.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Same token Playwright expects in DEV_BEARER_TOKEN.
      E2E_DEV_BEARER_TOKEN: dev.admin.e2e@example.com.00000000-0000-0000-0000-000000000001

    steps:
      - uses: actions/checkout@v4

      # ── Backend (memory persistence, no DB needed) ────────────────────
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - working-directory: backend
        run: pip install -e ".[dev]"
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:8000/api/v1/health && exit 0 || sleep 1
          done
          echo "Backend never became healthy"; cat backend.log; exit 1

      # ── Frontend + Playwright ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package.json }
      - working-directory: frontend
        run: npm install --legacy-peer-deps
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          E2E_BACKEND_URL: http://localhost:8000
          DEV_BEARER_TOKEN: ${{ env.E2E_DEV_BEARER_TOKEN }}
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
