[project]
name = "smms-backend"
version = "0.1.0"
description = "Social Media Management System — backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "cryptography>=42",
  "tenacity>=8.3",
  "celery>=5.4",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "dependency-injector>=4.41",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "prometheus-client>=0.20",
  # Supabase: Python SDK for auth/storage/realtime; Postgres traffic uses asyncpg above
  "supabase>=2.5",
  # optional, fall through gracefully if missing:
  "anthropic>=0.34 ; python_version >= '3.11'",
  "openai>=1.40 ; python_version >= '3.11'",
  "langgraph>=0.2 ; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
]
observability = [
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
